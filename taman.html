<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Papan kawasan digital: daftar pohon di dalam taman dan di jalan sekitar, status kesehatan, dan akses cepat ke halaman informasi setiap pohon di Kota Yogyakarta.">
  <meta name="theme-color" content="#1B3B1A">
  <title>Papan Kawasan — Sistem Informasi Pohon Perkotaan</title>
  <link rel="icon" type="image/png" href="assets/DLHLog.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="halaman halaman-publik halaman-taman">
  <a class="lewati-ke-konten" href="#isi-taman">Lewati ke konten utama</a>

  <header class="kepala-publik">
    <div class="wadah">
      <a class="merek" href="index.html" aria-label="Beranda Sistem Informasi Pohon Perkotaan">
        <img class="logo-dlh" src="assets/DLHLog.png" alt="Logo DLH" width="38" height="38">
        <span class="merek-teks">
          <span class="merek-judul">Pohon Perkotaan</span>
          <span class="merek-sub">Dinas Lingkungan Hidup</span>
        </span>
      </a>
      <span class="penanda-kota">Kota Yogyakarta</span>
    </div>
  </header>

  <main class="wadah halaman-isi">
    <div class="bilah-aksi">
      <button class="tombol tombol-sekunder tombol-kecil" type="button" id="tombol-scan" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path>
          <path d="M8 8h3v3H8zM13 8h3v3h-3zM8 13h3v3H8zM14 14h2v2h-2z"></path>
        </svg>
        Simulasi Scan QR
      </button>
    </div>

    <div id="isi-taman">
      <section class="kartu kartu-isi" aria-label="Memuat data">
        <p class="teks-redup">Memuat data kawasan...</p>
      </section>
    </div>

    <noscript>
      <section class="kartu kartu-isi bagian">
        <p>Halaman ini membutuhkan JavaScript untuk menampilkan daftar pohon dan kolom pencarian.</p>
      </section>
    </noscript>
  </main>

  <footer class="kaki">
    <p>Dinas Lingkungan Hidup Kota Yogyakarta - Smart Environment Initiative</p>
  </footer>

  <dialog class="dialog" id="dialog-scan" aria-labelledby="judul-dialog-scan" aria-describedby="deskripsi-dialog-scan">
    <form class="dialog-isi" id="form-scan" novalidate>
      <h2 id="judul-dialog-scan">Simulasi Scan QR</h2>
      <p class="teks-redup" id="deskripsi-dialog-scan">Masukkan kode pohon yang tertera pada papan atau batang pohon.</p>
      <div class="form-grup">
        <label class="label-form" for="input-scan">Kode pohon</label>
        <input class="kontrol" id="input-scan" name="kode" type="text" placeholder="Contoh: PH-YOG-042" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="error-scan">
        <p class="pesan-error" id="error-scan" role="alert" hidden></p>
      </div>
      <div class="dialog-aksi">
        <button class="tombol tombol-sekunder" type="button" id="tombol-batal-scan">Batal</button>
        <button class="tombol tombol-utama" type="submit">Buka Halaman Pohon</button>
      </div>
    </form>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/taman.js"></script>
</body>
</html>
